rules:
  # Tailscale must be DIRECT first: ts.net is a MagicDNS private domain,
  # and 100.64.0.0/10 is CGNAT/tailnet that proxy nodes cannot resolve or reach.
  - RULE-SET,tailscale,DIRECT
  # Cloudflare must also be DIRECT before gfw/proxy: cfargotunnel/trycloudflare/
  # cloudflare-dns/one.one.one.one are on those lists and would otherwise be proxied.
  - RULE-SET,cloudflare,DIRECT
  # LAN & private
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve
  # ads & security threats
  - RULE-SET,reject,REJECT
  - RULE-SET,security,REJECT
  # Apple / iCloud reachable directly
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  # PT: tracker direct first, then PT web / images proxy
  - RULE-SET,pt-direct,DIRECT
  - RULE-SET,pt-proxy,Select
  # Coding AI / agents: direct first, then proxy
  - RULE-SET,ai-coding-direct,DIRECT
  - RULE-SET,ai-coding-proxy,Select
  # Google
  - RULE-SET,google,Select
  # Telegram IP ranges
  - RULE-SET,telegramcidr,Select,no-resolve
  # proxied domains
  - RULE-SET,gfw,Select
  - RULE-SET,greatfire,Select
  - RULE-SET,tld-not-cn,Select
  - RULE-SET,proxy,Select
  # China domains
  - RULE-SET,direct,DIRECT
  # China IP ranges (two sources) + GeoIP fallback
  - RULE-SET,cncidr,DIRECT,no-resolve
  - RULE-SET,china-ip-list,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  # final fallback
  - MATCH,DIRECT

