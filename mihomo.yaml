# =====================================================================
# Example mihomo configuration consuming rules from the `mihomo` branch.
# Replace example node parameters (server/uuid/public-key) with real values.
# =====================================================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
# IPv6: dual-stack listener + IPv6 outbound. AAAA lookups are resolved normally,
# so IPv6-only services and CMIN2/IPv6-optimized routes work end to end.
ipv6: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # IPv6 fake-IP range for AAAA answers (kept inside the tunnel).
  fake-ip-range6: fc00::/18
  # Bootstrap resolvers must be reachable **without** going through the tunnel.
  # Only plain IPv4 addresses are safe here: DoH/TLS endpoints are not resolved yet,
  # and IPv6 resolvers would break hosts without IPv6 connectivity.
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    # IPv4 DoH / DoT (works everywhere)
    - tls://223.5.5.5
    - https://doh.pub
    # IPv6 DoT (reached over IPv6 when the network supports it)
    - tls://240e:4c:4008::1
    - tls://2408:8000:1000:8000::1
    # IPv4 DoH fallback kept for IPv6-less networks
    - https://dns.alidns.com/dns-query
  # MagicDNS exists only on Tailscale's 100.100.100.100; public DoH cannot resolve *.ts.net
  nameserver-policy:
    "+.ts.net":
      - 100.100.100.100
  # Keep ts.net out of fake-IP; DIRECT needs the real tailnet IP
  fake-ip-filter:
    - "+.ts.net"
    # cloudflared Tunnel / WARP need the real edge IP, not a fake-IP
    - "+.argotunnel.com"
    - "+.cfargotunnel.com"
    - "+.cloudflare-dns.com"

# TUN configuration: mixed stack with auto-routing (IPv4 + IPv6).
# Crucial: route-exclude-address excludes Tailscale CGNAT and IPv6 ULA from mihomo TUN,
# ensuring Tailscale peer and MagicDNS traffic flows directly via Tailscale's utun adapter.
tun:
  enable: true
  stack: mixed
  # Take over both address families; without these the IPv6 traffic bypasses TUN
  # and keeps leaking outside the tunnel.
  auto-route: true
  auto-detect-interface: true
  inet4-address:
    - 172.19.0.1/30
  inet6-address:
    - fdfe:dcba:9876::1/126
  # macOS / Windows: also add the IPv6 default route
  strict-route: false
  dns-hijack:
    - any:53
  # Tailscale CGNAT (IPv4) and Tailscale ULA (IPv6) must stay outside the tunnel
  route-exclude-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48


proxies:
- name: "jp-reality-01"
  type: vless
  server: jp01.example.com
  port: 443
  uuid: d342d11e-d424-4583-b36e-524ab1f0afa4
  udp: true
  flow: xtls-rprx-vision
  packet-encoding: xudp
  tls: true
  servername: www.example.com
  alpn:
  - h2
  - http/1.1
  client-fingerprint: chrome
  skip-cert-verify: false
  network: tcp
  reality-opts:
    public-key: PBK_REPLACE_ME

- name: "sg-reality-02"
