proxy-groups:
- name: Select
  type: select
  proxies:
  - Fallback
  - Auto
  - jp-reality-01
  - sg-reality-02
  - us-reality-03
- name: Auto
  type: url-test
  proxies:
  - jp-reality-01
  - sg-reality-02
  - us-reality-03
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: Fallback
  type: fallback
  proxies:
  - jp-reality-01
  - sg-reality-02
  - us-reality-03
  url: http://www.gstatic.com/generate_204
  interval: 300


rule-providers:
  # Cloudflare Tunnel / Zero Trust / WARP / DoH: must be DIRECT, so it is
  # referenced before gfw/proxy which classify some of these as proxied.
  cloudflare:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/cloudflare.txt
    interval: 86400
  # Classical ruleset mixing domains and CIDRs: Tailscale MagicDNS / Serve / CGNAT
  tailscale:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/tailscale.txt
    interval: 86400
  # PT: tracker announce direct first, then PT web / images proxy
  pt-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/pt-direct.txt
    interval: 86400
