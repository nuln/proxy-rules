# =====================================================================
# Lite mihomo configuration consuming rules from the `mihomo` branch.
# Uses `include-all: true` to automatically absorb subscription proxies.
# =====================================================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - tls://223.5.5.5
    - https://doh.pub
  # MagicDNS exists only on Tailscale's 100.100.100.100; public DoH cannot resolve *.ts.net
  nameserver-policy:
    "+.ts.net":
      - 100.100.100.100
  # Keep ts.net out of fake-IP; DIRECT needs the real tailnet IP
  fake-ip-filter:
    - "+.ts.net"
    # cloudflared Tunnel / WARP need the real edge IP, not a fake-IP
    - "+.argotunnel.com"
    - "+.cfargotunnel.com"
    - "+.cloudflare-dns.com"

# TUN configuration: mixed stack with auto-routing.
# Crucial: route-exclude-address excludes Tailscale CGNAT and IPv6 ULA from mihomo TUN,
# ensuring Tailscale peer and MagicDNS traffic flows directly via Tailscale's utun adapter.
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  route-exclude-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48

proxy-groups:
- name: Select
  type: select
  include-all: true

rule-providers:
  cloudflare:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/cloudflare.txt
    interval: 86400
  tailscale:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/tailscale.txt
    interval: 86400
  pt-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/pt-direct.txt
    interval: 86400
  pt-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/pt-proxy.txt
    interval: 86400
  ai-coding-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/ai-coding-direct.txt
    interval: 86400
  ai-coding-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/ai-coding-proxy.txt
    interval: 86400
  private:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/private.txt
    interval: 86400
  gfw:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/gfw.txt
    interval: 86400
  greatfire:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/greatfire.txt
    interval: 86400
  tld-not-cn:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/tld-not-cn.txt
    interval: 86400
  proxy:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/proxy.txt
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/telegramcidr.txt
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/lancidr.txt
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://cdn.jsdelivr.net/gh/nuln/proxy-rules@mihomo/cncidr.txt
    interval: 86400

rules:
  # Tailscale FIRST: ts.net (MagicDNS) + 100.64.0.0/10 (CGNAT) must be DIRECT
  - RULE-SET,tailscale,DIRECT
  # Cloudflare Tunnel / Zero Trust / DoH before gfw/proxy
  - RULE-SET,cloudflare,DIRECT
  # private / LAN hostnames -> Direct (short-circuit)
  - RULE-SET,private,DIRECT
  # PT: tracker direct first, then PT web / images proxy
  - RULE-SET,pt-direct,DIRECT
  - RULE-SET,pt-proxy,Select
  # Coding AI / agents: direct first, then Select (your nodes)
  - RULE-SET,ai-coding-direct,DIRECT
  - RULE-SET,ai-coding-proxy,Select
  # blocked domains -> Select (your nodes)
  - RULE-SET,gfw,Select
  - RULE-SET,greatfire,Select
  - RULE-SET,tld-not-cn,Select
  - RULE-SET,proxy,Select
  # Telegram IP ranges
  - RULE-SET,telegramcidr,Select,no-resolve
  # LAN IP ranges
  - RULE-SET,lancidr,DIRECT,no-resolve
  # China IP ranges + GeoIP fallback
  - RULE-SET,cncidr,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  # everything else -> Direct (blacklist semantics)
  - MATCH,DIRECT
